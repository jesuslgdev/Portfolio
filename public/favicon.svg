<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="faviconTitle faviconDesc">
  <title id="faviconTitle">JL Portfolio favicon</title>
  <desc id="faviconDesc">Rounded square badge with the initials JL matching the navbar branding.</desc>
  <defs>
    <linearGradient id="bg" x1="12" y1="10" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff1eb" />
      <stop offset="1" stop-color="#ffe7e0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#d8432a" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect x="8" y="8" width="48" height="48" rx="17" fill="url(#bg)" filter="url(#shadow)" />
  <rect x="8.75" y="8.75" width="46.5" height="46.5" rx="16.25" fill="none" stroke="#ffd2c6" stroke-width="1.5" />
  <text
    x="32"
    y="36"
    text-anchor="middle"
    font-family="Segoe UI, Poppins, Arial, sans-serif"
    font-size="21"
    font-weight="700"
    letter-spacing="1.8"
    fill="#d8432a"
  >
    JL
  </text>
</svg>
