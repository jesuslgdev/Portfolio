<header
  class="fixed inset-x-0 top-0 z-50 transition-all duration-300"
  [class.border-b]="isScrolled()"
  [class.border-app-border]="isScrolled()"
  [class.bg-app-shell-glass]="isScrolled()"
  [class.backdrop-blur-xl]="isScrolled()"
>
  <div class="mx-auto flex ds-max-w-page items-center justify-between px-5 py-4 sm:px-6 lg:px-8">
    <a href="#inicio" class="flex items-center gap-3 text-sm font-semibold uppercase tracking-[0.18em] text-app-heading">
      <span class="grid h-11 w-11 place-items-center rounded-2xl bg-app-accent-soft text-app-accent-strong shadow-app-sm">
        JL
      </span>
      <span class="hidden sm:block">Jesús Lobato</span>
    </a>

    <nav class="hidden items-center gap-8 md:flex">
      <a class="text-sm font-medium text-app-text-soft transition hover:text-app-heading" href="#sobre-mi">Sobre mí</a>
      <a class="text-sm font-medium text-app-text-soft transition hover:text-app-heading" href="#experiencia">Experiencia</a>
      <a class="text-sm font-medium text-app-text-soft transition hover:text-app-heading" href="#proyectos">Proyectos</a>
      <a class="text-sm font-medium text-app-text-soft transition hover:text-app-heading" href="#tecnologias">Tecnologías</a>
      <a class="text-sm font-medium text-app-text-soft transition hover:text-app-heading" href="#formacion">Formación</a>
      <a class="text-sm font-medium text-app-text-soft transition hover:text-app-heading" href="#contacto">Contacto</a>
    </nav>

    <div class="hidden items-center gap-3 md:flex">
      <a
        pButton
        href="/cv_jesus_lobato.pdf"
        download="cv_jesus_lobato.pdf"
        label="Descargar CV"
        icon="pi pi-download"
        iconPos="right"
        severity="contrast"
        [rounded]="true"
      ></a>
    </div>

    <button
      type="button"
      class="inline-flex h-11 w-11 items-center justify-center rounded-2xl border border-app-border bg-white text-app-heading md:hidden"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Abrir navegación"
    >
      <i class="pi text-base" [class.pi-bars]="!menuOpen()" [class.pi-times]="menuOpen()"></i>
    </button>
  </div>

  @if (menuOpen()) {
    <div class="border-t border-app-border bg-app-page-background px-5 py-4 md:hidden">
      <nav class="mx-auto flex ds-max-w-page flex-col gap-2">
        <a class="rounded-2xl px-4 py-3 text-sm font-medium text-app-text-soft transition hover:bg-app-accent-muted hover:text-app-heading" href="#sobre-mi" (click)="closeMenu()">Sobre mí</a>
        <a class="rounded-2xl px-4 py-3 text-sm font-medium text-app-text-soft transition hover:bg-app-accent-muted hover:text-app-heading" href="#experiencia" (click)="closeMenu()">Experiencia</a>
        <a class="rounded-2xl px-4 py-3 text-sm font-medium text-app-text-soft transition hover:bg-app-accent-muted hover:text-app-heading" href="#proyectos" (click)="closeMenu()">Proyectos</a>
        <a class="rounded-2xl px-4 py-3 text-sm font-medium text-app-text-soft transition hover:bg-app-accent-muted hover:text-app-heading" href="#tecnologias" (click)="closeMenu()">Tecnologías</a>
        <a class="rounded-2xl px-4 py-3 text-sm font-medium text-app-text-soft transition hover:bg-app-accent-muted hover:text-app-heading" href="#formacion" (click)="closeMenu()">Formación</a>
        <a class="rounded-2xl px-4 py-3 text-sm font-medium text-app-text-soft transition hover:bg-app-accent-muted hover:text-app-heading" href="#contacto" (click)="closeMenu()">Contacto</a>
      </nav>
    </div>
  }
</header>
